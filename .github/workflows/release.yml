name: Publish to PyPI

# Builds the distributions and uploads them to PyPI through Trusted Publishing
# (OIDC). The repository stores no PyPI token.
# v0.2.0 ships on GitHub only, so this runs only when started by hand. Once the
# PyPI trusted publisher exists, run it on the v0.2.0 tag to upload that release,
# or switch the trigger back to `release: types: [published]`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the release tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - name: Point README links at this tag for the PyPI page
        run: python scripts/pypi_readme.py --ref "${GITHUB_REF_NAME}"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mlx-direct-decider/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
