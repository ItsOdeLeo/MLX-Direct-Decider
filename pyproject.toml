[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-direct-decider"
version = "0.2.0"
description = "Use existing MLX LLMs and VLMs for local typed decisions on Apple Silicon, without fine-tuning or extra decision weights."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "MLX Direct Decider contributors"}]
keywords = [
  "mlx", "mlx-lm", "apple-silicon", "llm", "local-llm",
  "local-inference", "action-selection", "semantic-routing", "jev",
  "decision-model", "typed-decisions",
  "training-free", "logits", "mlx-vlm", "multimodal",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ItsOdeLeo/MLX-Direct-Decider"
Repository = "https://github.com/ItsOdeLeo/MLX-Direct-Decider"
Documentation = "https://github.com/ItsOdeLeo/MLX-Direct-Decider#documentation"
Issues = "https://github.com/ItsOdeLeo/MLX-Direct-Decider/issues"

[project.optional-dependencies]
mlx = ["mlx==0.31.2", "mlx-lm==0.31.3", "transformers==5.9.0", "tokenizers==0.22.2"]
vlm = ["mlx==0.31.2", "mlx-lm==0.31.3", "mlx-vlm==0.6.4", "transformers==5.9.0", "tokenizers==0.22.2"]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1", "setuptools>=77"]
browser = ["playwright==1.63.0"]

[project.scripts]
mlx-direct-decider = "mlx_direct_decider.cli:main"
mlx-zeroeffort-decider = "mlx_zeroeffort_decider.cli:main"
jev-mlx = "jev_mlx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlx_direct_decider = ["py.typed"]
mlx_zeroeffort_decider = ["py.typed"]
jev_mlx = ["static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires an explicit local model and Apple Metal (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
